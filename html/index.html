<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRÓN|Inicio de Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-body">

    <div class="login-container">
        <!-- Panel izquierdo con la imagen de fondo -->
        <div class="login-image-panel" style="background-image: url('img/fondo_inicio.jpg');">
            <div class="overlay"></div>
            <div class="brand-welcome">
                <h2>Bienvenido a Tu Estilo</h2>
                <p>Gestióna y controla tu inventario.</p>
            </div>
        </div>

        <!-- Panel derecho con el formulario -->
        <div class="login-form-panel">
            <div class="login-card">
                <div class="logo-container">
                    <img src="img/logo.png" alt="Logo MIRÓN" class="logo-img">
                    <h1>MIRÓN</h1>
                </div>
                <p class="subtitle">INICIO DE SESIÓN</p>

                <form id="loginForm" onsubmit="iniciarSesion(event)">
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="usuario@miron.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                    <div id="errorMsg" class="error-msg"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/interactividad.js"></script>
</body>
</html>
